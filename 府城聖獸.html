<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星宿八卦轉盤解謎</title>
<style>
  :root{
    --parchment:#e7dcc7;
    --parchment-dark:#d8c9a8;
    --ink:#2b2420;
    --accent:#8a5a3b;
    --accent-soft:#b8895f;
    --success:#4a7a4a;
    --success-bg:#e4efe0;
    --fail:#a3453f;
    --fail-bg:#f6e6e4;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(circle at 50% 20%, #efe6d3 0%, var(--parchment) 55%, #d9caa9 100%);
    font-family: "Noto Serif TC","Songti TC","PMingLiU", serif;
    color:var(--ink);
    padding:24px;
  }
  .wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:18px;
    max-width:640px;
    width:100%;
  }
  h1{
    font-size:1.4rem;
    letter-spacing:0.15em;
    margin:0;
    font-weight:600;
  }
  .sub{
    font-size:0.85rem;
    color:#6b5d4d;
    margin:0;
    text-align:center;
    line-height:1.6;
  }
  .stage{
    position:relative;
    width:min(86vw, 480px);
    aspect-ratio: 573 / 570;
    user-select:none;
    touch-action:none;
  }
  .ring-img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    filter: drop-shadow(0 6px 18px rgba(60,40,20,0.25));
  }
  .bagua-layer{
    position:absolute;
    /* sized/positioned to match the empty circle in the ring image, in % of stage */
    width: 50.09%;
    height: 50.35%;
    left: 25.48%;
    top: 25.26%;
    cursor: grab;
    will-change: transform;
    filter: drop-shadow(0 2px 6px rgba(40,25,10,0.35));
  }
  .bagua-layer.dragging{ cursor: grabbing; }
  .bagua-layer img{
    width:100%;
    height:100%;
    display:block;
    pointer-events:none;
    -webkit-user-drag:none;
  }
  .pointer-hint{
    position:absolute;
    left:50%;
    top:-14px;
    width:2px;
    height:14px;
    background:var(--accent);
    transform:translateX(-50%);
    opacity:0.85;
    border-radius:2px;
  }
  .hud{
    display:flex;
    align-items:center;
    gap:14px;
    font-size:0.85rem;
    color:#5a4c3d;
  }
  .angle-badge{
    font-variant-numeric: tabular-nums;
    background:var(--parchment-dark);
    border:1px solid #c3b18a;
    padding:4px 12px;
    border-radius:999px;
    font-size:0.9rem;
    letter-spacing:0.03em;
  }
  .controls{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    justify-content:center;
  }
  button{
    font-family:inherit;
    font-size:0.85rem;
    letter-spacing:0.05em;
    padding:9px 18px;
    border-radius:8px;
    border:1px solid var(--accent);
    background:transparent;
    color:var(--accent);
    cursor:pointer;
    transition:background 0.15s, color 0.15s, transform 0.1s;
  }
  button:hover{ background:var(--accent); color:#fff8ec; }
  button:active{ transform:scale(0.97); }
  button.primary{
    background:var(--accent);
    color:#fff8ec;
  }
  button.primary:hover{ background:var(--accent-soft); border-color:var(--accent-soft); }
  .result{
    min-height:1.4em;
    font-size:0.95rem;
    text-align:center;
    padding:8px 16px;
    border-radius:8px;
    opacity:0;
    transform:translateY(-4px);
    transition:opacity 0.25s, transform 0.25s;
  }
  .result.show{ opacity:1; transform:translateY(0); }
  .result.ok{ background:var(--success-bg); color:var(--success); }
  .result.no{ background:var(--fail-bg); color:var(--fail); }
  .result.warn{ background:#f1ece0; color:#8a7a5a; }
</style>
</head>
<body>
<div class="wrap">
  <h1>轉動天盤・對準星位</h1>

  </div>

  <div class="hud">
    <span>目前角度</span>
    <span class="angle-badge" id="angleReadout">0°</span>
  </div>

  <div class="controls">
    <button id="checkBtn" class="primary">確認答案</button>
    <button id="resetBtn">重置角度</button>
  </div>

  <div class="result" id="resultBox"></div>
</div>

<script>
(function(){
  // ---- 解謎設定區（之後在這裡填入正確答案）----
  // 正確角度：0~359 的整數，或設為 null 代表尚未設定
  let CORRECT_ANGLE = null;
  // 容許誤差（度）
  const TOLERANCE = 5;
  // 是否允許多組正確角度（例如八卦有 8 個對稱位置都算對，可填 [0,45,90,...]）
  // 若有值，會取代 CORRECT_ANGLE 的單一角度判斷
  let CORRECT_ANGLES = null; // 例如 [30, 120, 210, 300]
  // -------------------------------------------

  const stage = document.getElementById('stage');
  const layer = document.getElementById('baguaLayer');
  const angleReadout = document.getElementById('angleReadout');
  const checkBtn = document.getElementById('checkBtn');
  const resetBtn = document.getElementById('resetBtn');
  const resultBox = document.getElementById('resultBox');

  let currentAngle = 0; // degrees, 0-359
  let dragging = false;
  let startPointerAngle = 0;
  let startRotation = 0;

  function getCenter(){
    const rect = layer.getBoundingClientRect();
    return { x: rect.left + rect.width/2, y: rect.top + rect.height/2 };
  }

  function angleFromCenter(clientX, clientY){
    const c = getCenter();
    const dx = clientX - c.x;
    const dy = clientY - c.y;
    return Math.atan2(dy, dx) * 180 / Math.PI;
  }

  function normalize(a){
    a = a % 360;
    if(a < 0) a += 360;
    return a;
  }

  function applyRotation(){
    layer.style.transform = `rotate(${currentAngle}deg)`;
    angleReadout.textContent = Math.round(currentAngle) + '°';
  }

  function onPointerDown(e){
    dragging = true;
    layer.classList.add('dragging');
    const pt = (e.touches ? e.touches[0] : e);
    startPointerAngle = angleFromCenter(pt.clientX, pt.clientY);
    startRotation = currentAngle;
    hideResult();
    e.preventDefault();
  }

  function onPointerMove(e){
    if(!dragging) return;
    const pt = (e.touches ? e.touches[0] : e);
    const nowAngle = angleFromCenter(pt.clientX, pt.clientY);
    const delta = nowAngle - startPointerAngle;
    currentAngle = normalize(startRotation + delta);
    applyRotation();
    e.preventDefault();
  }

  function onPointerUp(){
    dragging = false;
    layer.classList.remove('dragging');
  }

  layer.addEventListener('pointerdown', onPointerDown);
  window.addEventListener('pointermove', onPointerMove);
  window.addEventListener('pointerup', onPointerUp);

  // touch fallback
  layer.addEventListener('touchstart', onPointerDown, {passive:false});
  window.addEventListener('touchmove', onPointerMove, {passive:false});
  window.addEventListener('touchend', onPointerUp);

  function showResult(text, type){
    resultBox.textContent = text;
    resultBox.className = 'result show ' + type;
  }
  function hideResult(){
    resultBox.className = 'result';
  }

  function isCorrect(angle){
    const targets = CORRECT_ANGLES && CORRECT_ANGLES.length ? CORRECT_ANGLES : (CORRECT_ANGLE !== null ? [CORRECT_ANGLE] : null);
    if(!targets) return null; // not configured
    for(const t of targets){
      let diff = Math.abs(normalize(angle) - normalize(t));
      diff = Math.min(diff, 360 - diff);
      if(diff <= TOLERANCE) return true;
    }
    return false;
  }

  checkBtn.addEventListener('click', function(){
    const res = isCorrect(currentAngle);
    if(res === null){
      showResult('（尚未設定正確答案，等待謎題設計完成）', 'warn');
    } else if(res){
      showResult('對齊正確！機關已開啟。', 'ok');
    } else {
      showResult('尚未對齊，再轉轉看。', 'no');
    }
  });

  resetBtn.addEventListener('click', function(){
    currentAngle = 0;
    applyRotation();
    hideResult();
  });

  applyRotation();
})();
</script>
